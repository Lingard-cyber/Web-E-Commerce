name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VPS_HOST: 103.103.23.46
  VPS_USER: jogjacreativepro
  VPS_APP_DIR: /home/jogjacreativepro/umkmkepuharjo
  COMPOSE_FILE: docker-compose.vps.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          install -m 700 -d "$HOME/.ssh"
          key="${SSH_PRIVATE_KEY//$'\r'/}"
          key="${key//$'\\n'/$'\n'}"
          printf '%s\n' "$key" > "$HOME/.ssh/id_ed25519"
          unset key
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload source to VPS
        run: |
          set -eu
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR'"
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'admin/.next/' \
            --exclude 'coverage/' \
            ./ "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Configure Xendit payment environment
        env:
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY || secrets.XENDIT_API_KEY }}
          XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN || secrets.XENDIT_CALLBACK_TOKEN }}
        run: |
          set -eu
          if [ -n "$XENDIT_SECRET_KEY" ] && [ -n "$XENDIT_WEBHOOK_TOKEN" ]; then
            {
              printf 'XENDIT_SECRET_KEY=%s\n' "$XENDIT_SECRET_KEY"
              printf 'XENDIT_WEBHOOK_TOKEN=%s\n' "$XENDIT_WEBHOOK_TOKEN"
              printf 'ENABLE_CHECKOUT=true\n'
            } | ssh "$VPS_USER@$VPS_HOST" "
              set -eu
              cd '$VPS_APP_DIR'
              touch .env.deploy
              tmp=\$(mktemp)
              grep -vE '^(XENDIT_SECRET_KEY|XENDIT_WEBHOOK_TOKEN|ENABLE_CHECKOUT)=' .env.deploy > \"\$tmp\" || true
              cat - >> \"\$tmp\"
              mv \"\$tmp\" .env.deploy
              chmod 600 .env.deploy
            "
          else
            ssh "$VPS_USER@$VPS_HOST" "
              set -eu
              cd '$VPS_APP_DIR'
              test -f .env.deploy
              grep -q '^XENDIT_SECRET_KEY=.' .env.deploy || { echo 'XENDIT_SECRET_KEY tidak ada di secret GitHub atau .env.deploy VPS.'; exit 1; }
              grep -q '^XENDIT_WEBHOOK_TOKEN=.' .env.deploy || { echo 'XENDIT_WEBHOOK_TOKEN tidak ada di secret GitHub atau .env.deploy VPS.'; exit 1; }
              tmp=\$(mktemp)
              grep -v '^ENABLE_CHECKOUT=' .env.deploy > \"\$tmp\" || true
              printf 'ENABLE_CHECKOUT=true\n' >> \"\$tmp\"
              mv \"\$tmp\" .env.deploy
              chmod 600 .env.deploy
            "
          fi

      - name: Build, migrate, and restart application
        run: |
          set -eu
          ssh "$VPS_USER@$VPS_HOST" "
            set -eu
            cd '$VPS_APP_DIR'
            test -f .env.deploy
            docker compose --env-file .env.deploy -f '$COMPOSE_FILE' build
            docker compose --env-file .env.deploy -f '$COMPOSE_FILE' run --rm storefront npx prisma migrate deploy
            docker compose --env-file .env.deploy -f '$COMPOSE_FILE' up -d --remove-orphans
            docker compose --env-file .env.deploy -f '$COMPOSE_FILE' run --rm storefront npm run db:cleanup-demo-user
            docker compose --env-file .env.deploy -f '$COMPOSE_FILE' ps
            curl --fail --silent --show-error --max-time 30 http://127.0.0.1:3010/ > /dev/null
          "

      - name: Verify public HTTPS endpoint
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 30 \
            https://umkmkepuharjo.my.id/ > /dev/null
          curl --fail --silent --show-error --max-time 30 \
            https://umkmkepuharjo.my.id/admin/login > /dev/null
