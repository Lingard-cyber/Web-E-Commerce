<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kepuharjo Market — etalase digital produk lokal Forkom UMKM Kalurahan Kepuharjo." />
    <title>Kepuharjo Market — Produk Lokal, Pasar Lebih Luas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --red: #982f2e;
        --red-deep: #742625;
        --red-soft: #ead0c5;
        --green: #73814d;
        --green-dark: #4c5b38;
        --cream: #f6f2e9;
        --paper: #fffdf8;
        --ink: #2f2a25;
        --muted: #81766c;
        --line: #e6ded4;
        --orange: #c7794f;
        --shadow: 0 18px 50px rgba(81, 57, 41, .11);
        --radius: 22px;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--cream); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      .site-shell { min-height: 100vh; }
      .topbar { background: var(--red-deep); color: #fff9ef; font-size: 12px; letter-spacing: .04em; }
      .topbar-inner { max-width: 1180px; margin: auto; padding: 9px 24px; display: flex; justify-content: space-between; gap: 16px; }
      .topbar span:last-child { opacity: .75; }
      .nav { position: sticky; top: 0; z-index: 20; background: rgba(255,253,248,.92); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(230,222,212,.8); }
      .nav-inner { max-width: 1180px; margin: auto; padding: 18px 24px; display: flex; align-items: center; gap: 30px; }
      .brand { display: flex; align-items: center; gap: 10px; min-width: 210px; }
      .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--red); border-radius: 50%; color: var(--red); font-family: "Playfair Display", serif; font-size: 18px; }
      .brand-text { line-height: .95; }
      .brand-name { display: block; font-size: 15px; font-weight: 700; letter-spacing: .14em; }
      .brand-sub { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
      .nav-links { display: flex; align-items: center; gap: 24px; color: #6f655e; font-size: 13px; flex: 1; }
      .nav-links button { padding: 0; border: 0; background: none; color: inherit; }
      .nav-links button:hover, .nav-links button.active { color: var(--red); }
      .nav-actions { display: flex; gap: 8px; align-items: center; }
      .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; background: transparent; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); position: relative; }
      .icon-btn:hover { border-color: var(--red); color: var(--red); }
      .cart-count { position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 20px; background: var(--red); color: #fff; font-size: 10px; display: grid; place-items: center; }
      .menu-btn { display: none; }
      .view { max-width: 1180px; margin: auto; padding: 56px 24px 100px; }
      .hero { position: relative; overflow: hidden; min-height: 530px; display: grid; grid-template-columns: 1.06fr .94fr; align-items: center; gap: 34px; padding: 62px; border-radius: 32px; background: var(--red); color: #fff9ef; }
      .hero::before, .hero::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.16); border-radius: 50%; pointer-events: none; }
      .hero::before { width: 580px; height: 580px; right: -200px; bottom: -250px; }
      .hero::after { width: 440px; height: 440px; right: -130px; bottom: -180px; }
      .eyebrow { margin: 0 0 18px; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; opacity: .78; }
      h1, h2, h3, p { margin-top: 0; }
      h1, h2, h3 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; }
      h1 { max-width: 570px; margin-bottom: 18px; font-size: clamp(45px, 6vw, 78px); line-height: .98; letter-spacing: -.055em; }
      .hero-copy p { max-width: 470px; margin-bottom: 30px; color: rgba(255,249,239,.77); font-size: 16px; line-height: 1.7; }
      .btn { border: 0; border-radius: 99px; padding: 13px 20px; font-size: 13px; font-weight: 700; transition: transform .2s, box-shadow .2s, background .2s; }
      .btn:hover { transform: translateY(-2px); }
      .btn-primary { background: #fff9ef; color: var(--red); box-shadow: 0 10px 24px rgba(45,20,17,.16); }
      .btn-dark { background: var(--ink); color: #fff; }
      .btn-outline { border: 1px solid var(--line); background: transparent; color: var(--ink); }
      .btn-outline-light { border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff; }
      .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .hero-art { min-height: 360px; position: relative; z-index: 1; display: grid; place-items: center; }
      .hero-image { width: 80%; height: 350px; object-fit: cover; border-radius: 150px 150px 24px 24px; filter: saturate(.8); box-shadow: 20px 24px 0 rgba(89,32,27,.22); }
      .hero-stamp { position: absolute; left: 0; bottom: 14px; width: 125px; height: 125px; display: grid; place-items: center; padding: 20px; border: 1px solid rgba(255,255,255,.65); border-radius: 50%; background: rgba(152,47,46,.82); font-family: "Playfair Display", serif; font-size: 18px; line-height: 1.05; text-align: center; transform: rotate(-10deg); }
      .section { padding-top: 74px; }
      .section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
      .section-head h2 { margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1; letter-spacing: -.04em; }
      .section-head p { max-width: 430px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .text-link { border: 0; background: none; color: var(--red); font-size: 13px; font-weight: 700; white-space: nowrap; }
      .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
      .category-card { min-height: 190px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: end; padding: 22px; border-radius: var(--radius); color: #fff; background: var(--green); }
      .category-card::after { content: ""; position: absolute; width: 160px; height: 160px; top: -70px; right: -30px; border: 1px solid rgba(255,255,255,.24); border-radius: 50%; }
      .category-card:nth-child(2) { background: var(--red); }
      .category-card:nth-child(3) { background: #b56b48; }
      .category-card:nth-child(4) { background: #5c6345; }
      .category-card .number { position: absolute; top: 18px; right: 18px; font-size: 11px; opacity: .7; }
      .category-card h3 { position: relative; z-index: 1; max-width: 150px; margin: 0 0 7px; font-size: 25px; line-height: 1; }
      .category-card p { position: relative; z-index: 1; margin: 0; font-size: 12px; opacity: .78; }
      .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
      .product-card { position: relative; min-width: 0; }
      .product-image { height: 245px; overflow: hidden; position: relative; border-radius: var(--radius); background: #e5d3be; }
      .product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
      .product-card:hover .product-image img { transform: scale(1.04); }
      .product-tag { position: absolute; top: 12px; left: 12px; padding: 6px 9px; border-radius: 99px; background: rgba(255,253,248,.9); color: var(--red); font-size: 10px; font-weight: 700; }
      .like-btn { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,253,248,.88); color: var(--red); }
      .product-body { padding: 14px 2px 0; }
      .product-body h3 { margin: 0 0 5px; font-family: "DM Sans", sans-serif; font-size: 15px; font-weight: 700; }
      .product-meta { color: var(--muted); font-size: 12px; }
      .product-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
      .price { color: var(--red); font-size: 15px; font-weight: 700; }
      .add-mini { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--ink); color: #fff; font-size: 18px; }
      .story-panel { display: grid; grid-template-columns: .9fr 1.1fr; gap: 28px; align-items: stretch; padding: 28px; border-radius: 28px; background: #e8e2d4; }
      .story-image { min-height: 330px; overflow: hidden; border-radius: 20px; }
      .story-image img { width: 100%; height: 100%; object-fit: cover; }
      .story-copy { display: flex; flex-direction: column; justify-content: center; padding: 20px 22px; }
      .story-copy h2 { max-width: 520px; margin-bottom: 17px; font-size: clamp(32px, 4vw, 54px); line-height: 1; }
      .story-copy p { max-width: 510px; margin-bottom: 24px; color: #6d655d; line-height: 1.7; }
      .story-stats { display: flex; gap: 24px; margin-top: 20px; }
      .stat strong { display: block; color: var(--red); font-family: "Playfair Display", serif; font-size: 32px; }
      .stat span { color: var(--muted); font-size: 11px; }
      .quote-panel { display: grid; grid-template-columns: 1.1fr .9fr; overflow: hidden; border-radius: 28px; background: var(--green-dark); color: #fff; }
      .quote-copy { padding: 48px; }
      .quote-copy h2 { max-width: 520px; margin-bottom: 22px; font-size: clamp(32px, 4vw, 54px); line-height: 1; }
      .quote-copy blockquote { max-width: 620px; margin: 0 0 22px; font-family: "Playfair Display", serif; font-size: 23px; line-height: 1.45; }
      .quote-copy cite { color: rgba(255,255,255,.65); font-size: 12px; font-style: normal; }
      .quote-art { min-height: 310px; overflow: hidden; }
      .quote-art img { width: 100%; height: 100%; object-fit: cover; opacity: .83; }
      .benefit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .benefit { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,253,248,.55); }
      .benefit-icon { width: 38px; height: 38px; display: grid; place-items: center; margin-bottom: 20px; border-radius: 50%; background: var(--red-soft); color: var(--red); }
      .benefit h3 { margin-bottom: 8px; font-family: "DM Sans", sans-serif; font-size: 15px; }
      .benefit p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
      .page-head { display: flex; justify-content: space-between; align-items: end; gap: 22px; margin-bottom: 34px; }
      .page-head h1 { max-width: 670px; color: var(--red); margin: 0; font-size: clamp(42px, 6vw, 72px); }
      .page-head p { max-width: 420px; margin: 0; color: var(--muted); line-height: 1.7; }
      .filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
      .filter-select { padding: 11px 14px; border: 1px solid var(--line); border-radius: 99px; background: var(--paper); color: var(--ink); font-size: 12px; }
      .filter-search { min-width: 250px; flex: 1; padding: 12px 16px; border: 1px solid var(--line); border-radius: 99px; background: var(--paper); outline: none; }
      .filter-search:focus { border-color: var(--red); }
      .result-count { margin-left: auto; color: var(--muted); font-size: 12px; }
      .category-page-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
      .category-feature { min-height: 270px; display: flex; flex-direction: column; justify-content: end; padding: 30px; border-radius: 28px; color: #fff; overflow: hidden; position: relative; }
      .category-feature::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(25,21,17,.62), transparent 68%); }
      .category-feature > * { position: relative; z-index: 1; }
      .category-feature h2 { margin: 0 0 6px; font-size: 34px; }
      .category-feature p { margin: 0; font-size: 13px; opacity: .82; }
      .category-feature:nth-child(1) { background: url('https://images.unsplash.com/photo-1621939514649-280e2aa92a7f?auto=format&fit=crop&w=1000&q=85') center/cover; }
      .category-feature:nth-child(2) { background: url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?auto=format&fit=crop&w=1000&q=85') center/cover; }
      .category-feature:nth-child(3) { background: url('https://images.unsplash.com/photo-1556228578-0d85b1a4d571?auto=format&fit=crop&w=1000&q=85') center/cover; }
      .category-feature:nth-child(4) { background: url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1000&q=85') center/cover; }
      .umkm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .umkm-card { overflow: hidden; border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); }
      .umkm-card img { width: 100%; height: 210px; object-fit: cover; }
      .umkm-body { padding: 20px; }
      .umkm-body h3 { margin: 0 0 7px; font-family: "DM Sans", sans-serif; font-size: 17px; }
      .umkm-body p { min-height: 62px; margin-bottom: 16px; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .about-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: 30px; align-items: center; }
      .about-image { min-height: 530px; overflow: hidden; border-radius: 28px; }
      .about-image img { width: 100%; height: 100%; object-fit: cover; }
      .about-copy h2 { max-width: 620px; margin-bottom: 20px; color: var(--red); font-size: clamp(40px, 5vw, 68px); line-height: 1; }
      .about-copy p { max-width: 550px; color: var(--muted); line-height: 1.8; }
      .about-note { margin-top: 28px; padding: 20px 22px; border-left: 3px solid var(--green); background: #ebe6d9; color: #61594f; font-size: 13px; line-height: 1.7; }
      .help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .faq { padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
      .faq h3 { margin: 0 0 9px; font-family: "DM Sans", sans-serif; font-size: 15px; }
      .faq p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
      .footer { background: var(--ink); color: #fff8ed; }
      .footer-inner { max-width: 1180px; margin: auto; padding: 56px 24px 26px; }
      .footer-main { display: flex; justify-content: space-between; gap: 35px; padding-bottom: 45px; }
      .footer h2 { max-width: 360px; margin: 0; font-size: 38px; line-height: 1; }
      .footer-links { display: grid; grid-template-columns: repeat(2, 130px); gap: 12px 24px; color: rgba(255,248,237,.65); font-size: 12px; }
      .footer-links button { padding: 0; border: 0; background: transparent; color: inherit; text-align: left; }
      .footer-bottom { display: flex; justify-content: space-between; gap: 15px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.14); color: rgba(255,248,237,.5); font-size: 11px; }
      .hidden { display: none !important; }
      .empty-state { grid-column: 1/-1; padding: 55px 20px; border: 1px dashed var(--line); border-radius: 20px; color: var(--muted); text-align: center; }
      .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(39,26,21,.55); backdrop-filter: blur(8px); }
      .modal { width: min(900px, 100%); max-height: 90vh; overflow: auto; border-radius: 28px; background: var(--paper); box-shadow: 0 30px 90px rgba(25,15,10,.25); }
      .modal.product-modal { display: grid; grid-template-columns: .9fr 1.1fr; }
      .modal-visual { min-height: 420px; overflow: hidden; border-radius: 28px 0 0 28px; background: #dfccb5; }
      .modal-visual img { width: 100%; height: 100%; object-fit: cover; }
      .modal-content { position: relative; padding: 42px; }
      .close-btn { position: absolute; top: 17px; right: 17px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--cream); color: var(--ink); }
      .modal-content h2 { margin-bottom: 10px; color: var(--red); font-size: 43px; line-height: 1; }
      .modal-content .large-price { margin: 20px 0; color: var(--red); font-family: "Playfair Display", serif; font-size: 28px; }
      .modal-content p { color: var(--muted); font-size: 14px; line-height: 1.75; }
      .modal-actions { display: flex; gap: 10px; margin-top: 26px; }
      .drawer { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: end; background: rgba(39,26,21,.35); }
      .drawer-panel { width: min(430px, 100%); height: 100%; overflow: auto; padding: 28px; background: var(--paper); box-shadow: -18px 0 50px rgba(25,15,10,.18); }
      .drawer-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
      .drawer-head h2 { margin: 0; font-size: 30px; }
      .cart-list { padding: 16px 0; }
      .cart-item { display: grid; grid-template-columns: 65px 1fr auto; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
      .cart-item img { width: 65px; height: 65px; object-fit: cover; border-radius: 12px; }
      .cart-item h3 { margin: 0 0 5px; font-family: "DM Sans", sans-serif; font-size: 13px; }
      .cart-item p { margin: 0; color: var(--red); font-size: 12px; font-weight: 700; }
      .qty-control { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: 12px; }
      .qty-control button { width: 23px; height: 23px; border: 1px solid var(--line); border-radius: 50%; background: transparent; }
      .cart-summary { padding-top: 16px; }
      .summary-row { display: flex; justify-content: space-between; margin: 10px 0; color: var(--muted); font-size: 13px; }
      .summary-row.total { margin-top: 18px; color: var(--ink); font-size: 17px; font-weight: 700; }
      .checkout-note { margin-top: 20px; padding: 13px; border-radius: 12px; background: #e9efdf; color: var(--green-dark); font-size: 11px; line-height: 1.5; }
      .toast { position: fixed; left: 50%; bottom: 25px; z-index: 100; padding: 13px 18px; border-radius: 99px; background: var(--ink); color: #fff; box-shadow: var(--shadow); font-size: 12px; transform: translate(-50%, 120px); transition: transform .3s; }
      .toast.show { transform: translate(-50%, 0); }
      @media (max-width: 900px) {
        .nav-inner { gap: 14px; }
        .brand { min-width: auto; flex: 1; }
        .nav-links { position: absolute; top: 73px; left: 0; right: 0; display: none; padding: 16px 24px 22px; background: var(--paper); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); flex-direction: column; align-items: start; gap: 16px; }
        .nav-links.open { display: flex; }
        .menu-btn { display: grid; }
        .hero { grid-template-columns: 1fr; padding: 44px 32px; }
        .hero-art { min-height: 250px; }
        .hero-image { width: 68%; height: 270px; }
        .category-grid, .product-grid { grid-template-columns: repeat(2, 1fr); }
        .story-panel, .quote-panel, .about-grid { grid-template-columns: 1fr; }
        .story-image { min-height: 240px; }
        .quote-art { min-height: 230px; order: -1; }
        .about-image { min-height: 330px; }
        .umkm-grid { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 560px) {
        .topbar-inner { padding-left: 16px; padding-right: 16px; }
        .topbar span:last-child { display: none; }
        .nav-inner { padding: 14px 16px; }
        .brand-name { font-size: 13px; }
        .brand-sub { font-size: 8px; }
        .nav-actions .icon-btn:first-child { display: none; }
        .view { padding: 32px 16px 70px; }
        .hero { min-height: 640px; padding: 34px 24px; border-radius: 23px; }
        h1 { font-size: 51px; }
        .hero-image { width: 82%; height: 260px; }
        .hero-stamp { left: 5px; bottom: -4px; width: 100px; height: 100px; font-size: 14px; }
        .section { padding-top: 55px; }
        .section-head, .page-head, .footer-main { align-items: start; flex-direction: column; }
        .section-head h2 { font-size: 36px; }
        .category-grid, .product-grid, .category-page-grid, .benefit-grid, .help-grid, .umkm-grid { grid-template-columns: 1fr; }
        .product-image { height: 280px; }
        .story-panel, .quote-panel { padding: 15px; }
        .story-copy, .quote-copy { padding: 18px 8px 10px; }
        .quote-copy blockquote { font-size: 19px; }
        .page-head h1 { font-size: 48px; }
        .filter-search { min-width: 100%; }
        .result-count { margin-left: 0; }
        .modal.product-modal { display: block; }
        .modal-visual { min-height: 250px; border-radius: 28px 28px 0 0; }
        .modal-content { padding: 30px 24px 28px; }
        .footer-links { grid-template-columns: repeat(2, 1fr); width: 100%; }
        .footer-bottom { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="topbar"><div class="topbar-inner"><span>Produk lokal, pasar lebih luas.</span><span>Etalase bersama Forkom UMKM Kepuharjo · Sleman, DIY</span></div></div>
      <header class="nav">
        <div class="nav-inner">
          <button class="icon-btn menu-btn" aria-label="Buka menu" data-menu><span>☰</span></button>
          <a class="brand" href="#/" data-route="home"><span class="brand-mark">K</span><span class="brand-text"><span class="brand-name">KEPUHARJO</span><span class="brand-sub">market · dari warga, untuk warga</span></span></a>
          <nav class="nav-links" data-nav>
            <button data-route="home">Beranda</button>
            <button data-route="shop">Belanja</button>
            <button data-route="categories">Kategori</button>
            <button data-route="umkm">UMKM</button>
            <button data-route="about">Tentang</button>
            <button data-route="welcome">Sambutan</button>
            <button data-route="help">Bantuan</button>
          </nav>
          <div class="nav-actions"><button class="icon-btn" aria-label="Cari" data-focus-search>⌕</button><button class="icon-btn" aria-label="Keranjang" data-cart>♡<span class="cart-count" data-cart-count>0</span></button></div>
        </div>
      </header>

      <main id="app"></main>

      function render() { const views = { home: homeView, shop: shopView, categories: categoriesView, umkm: umkmView, about: aboutView, welcome: welcomeView, help: helpView }; document.querySelector('#app').innerHTML = (views[currentRoute] || homeView)(); document.querySelectorAll('[data-route]').forEach(el => el.classList.toggle('active', el.dataset.route === currentRoute)); window.scrollTo({ top: 0, behavior: 'smooth' }); bindView(); }
      function bindView() { document.querySelectorAll('[data-route]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); const route = el.dataset.route; if (location.hash !== '#/' + route) location.hash = '#/' + route; else { currentRoute = route; render(); } document.querySelector('[data-nav]')?.classList.remove('open'); })); document.querySelectorAll('[data-category-route]').forEach(el => el.addEventListener('click', () => { selectedCategory = el.dataset.categoryRoute; location.hash = '#/shop'; })); document.querySelectorAll('[data-add]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); addToCart(Number(el.dataset.add)); })); document.querySelectorAll('.product-card').forEach((card, i) => card.addEventListener('click', e => { if (e.target.closest('[data-add], .like-btn')) return; const list = currentRoute === 'shop' ? filteredProducts() : products.slice(0, 8); openProduct(list[i] || products[i]); })); document.querySelectorAll('[data-shop-search]').forEach(el => el.addEventListener('input', e => { searchTerm = e.target.value; render(); setTimeout(() => { const input = document.querySelector('[data-shop-search]'); input?.focus(); input?.setSelectionRange(searchTerm.length, searchTerm.length); }, 0); })); document.querySelector('[data-category-filter]')?.addEventListener('change', e => { selectedCategory = e.target.value; render(); }); document.querySelector('[data-sort-filter]')?.addEventListener('change', e => { sortMode = e.target.value; render(); }); document.querySelectorAll('[data-maker]').forEach(el => el.addEventListener('click', () => { showToast('Profil UMKM sedang disiapkan untuk tahap konten berikutnya.'); })); document.querySelector('[data-contact]')?.addEventListener('click', () => showToast('Kontak admin akan dihubungkan pada tahap backend.')); }
      function filteredProducts() { let list = products.filter(p => (selectedCategory === 'Semua kategori' || p.category === selectedCategory) && `${p.name} ${p.maker} ${p.category}`.toLowerCase().includes(searchTerm.toLowerCase())); if (sortMode === 'Harga terendah') list.sort((a,b) => (a.price || 0) - (b.price || 0)); if (sortMode === 'Harga tertinggi') list.sort((a,b) => (b.price || 0) - (a.price || 0)); return list; }
      function addToCart(id) { const product = products.find(p => p.id === id); if (!product || !product.price) { showToast('Produk ini menggunakan alur konsultasi terlebih dahulu.'); return; } const existing = cart.find(item => item.id === id); existing ? existing.qty++ : cart.push({ id, qty: 1 }); persistCart(); updateCartCount(); showToast(`${product.name} ditambahkan ke keranjang`); }
      function persistCart() { localStorage.setItem('kepuharjo-cart', JSON.stringify(cart)); }
      function updateCartCount() { document.querySelector('[data-cart-count]').textContent = cart.reduce((sum, item) => sum + item.qty, 0); }
      function openProduct(product) { document.querySelector('[data-modal-root]').className = ''; document.querySelector('[data-modal-root]').innerHTML = `<div class="modal-backdrop" data-close-modal><div class="modal product-modal"><div class="modal-visual"><img src="${product.image}" alt="${esc(product.name)}" /></div><div class="modal-content"><button class="close-btn" data-close-modal aria-label="Tutup">×</button><p class="eyebrow" style="color:var(--red)">${esc(product.category)}</p><h2>${esc(product.name)}</h2><p style="font-size:13px;color:var(--ink)">Dibuat oleh <strong>${esc(product.maker)}</strong></p><div class="large-price">${rupiah(product.price)}</div><p>${esc(product.description)}</p><div class="modal-actions">${product.price ? `<button class="btn btn-dark" data-modal-add="${product.id}">+ Tambah ke keranjang</button>` : '<button class="btn btn-dark" data-modal-contact>Mulai konsultasi</button>'}<button class="btn btn-outline" data-close-modal>Tutup</button></div></div></div></div>`; document.querySelector('[data-close-modal]').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('.close-btn')) closeModal(); }); document.querySelector('[data-modal-add]')?.addEventListener('click', () => { addToCart(product.id); closeModal(); }); document.querySelector('[data-modal-contact]')?.addEventListener('click', () => { closeModal(); showToast('Admin akan membantu kebutuhan jasa ini.'); }); }
      function closeModal() { const root = document.querySelector('[data-modal-root]'); root.className = 'hidden'; root.innerHTML = ''; }
      function openCart() { const root = document.querySelector('[data-drawer-root]'); root.className = ''; const items = cart.map(item => ({ ...item, product: products.find(p => p.id === item.id) })).filter(item => item.product); const subtotal = items.reduce((sum, item) => sum + (item.product.price * item.qty), 0); root.innerHTML = `<div class="drawer" data-close-drawer><aside class="drawer-panel"><div class="drawer-head"><h2>Keranjang</h2><button class="close-btn" data-close-drawer aria-label="Tutup">×</button></div><div class="cart-list">${items.length ? items.map(item => `<div class="cart-item"><img src="${item.product.image}" alt="${esc(item.product.name)}" /><div><h3>${esc(item.product.name)}</h3><p>${rupiah(item.product.price)}</p><div class="qty-control"><button data-qty="${item.id}" data-delta="-1">−</button><span>${item.qty}</span><button data-qty="${item.id}" data-delta="1">+</button></div></div><button class="text-link" style="font-size:18px" data-remove="${item.id}" aria-label="Hapus">×</button></div>`).join('') : '<div class="empty-state">Keranjangmu masih kosong.<br /><button class="text-link" data-route="shop" style="margin-top:15px">Mulai belanja →</button></div>'}</div>${items.length ? `<div class="cart-summary"><div class="summary-row"><span>Subtotal</span><strong>${rupiah(subtotal)}</strong></div><div class="summary-row"><span>Pengiriman</span><span>Dikonfirmasi admin</span></div><div class="summary-row total"><span>Total sementara</span><span>${rupiah(subtotal)}</span></div><button class="btn btn-dark" style="width:100%;margin-top:14px" data-checkout>Lanjut ke checkout</button><div class="checkout-note">Tahap frontend: alur pembayaran Xendit akan disambungkan setelah backend dan akun merchant siap.</div></div>` : ''}</aside></div>`; root.querySelector('[data-close-drawer]').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.closest('.close-btn')) closeCart(); }); root.querySelectorAll('[data-qty]').forEach(btn => btn.addEventListener('click', () => changeQty(Number(btn.dataset.qty), Number(btn.dataset.delta)))); root.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => removeFromCart(Number(btn.dataset.remove)))); root.querySelector('[data-checkout]')?.addEventListener('click', () => { closeCart(); showToast('Checkout siap dihubungkan ke Xendit pada tahap backend.'); }); root.querySelector('[data-route="shop"]')?.addEventListener('click', () => { closeCart(); location.hash = '#/shop'; }); }
      function closeCart() { const root = document.querySelector('[data-drawer-root]'); root.className = 'hidden'; root.innerHTML = ''; }
      function changeQty(id, delta) { const item = cart.find(i => i.id === id); if (!item) return; item.qty += delta; if (item.qty <= 0) cart = cart.filter(i => i.id !== id); persistCart(); updateCartCount(); openCart(); }
      function removeFromCart(id) { cart = cart.filter(i => i.id !== id); persistCart(); updateCartCount(); openCart(); }
      function showToast(message) { const el = document.querySelector('[data-toast]'); el.textContent = message; el.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }
      document.querySelector('[data-cart]').addEventListener('click', openCart); document.querySelector('[data-menu]').addEventListener('click', () => document.querySelector('[data-nav]').classList.toggle('open')); document.querySelector('[data-focus-search]').addEventListener('click', () => { location.hash = '#/shop'; setTimeout(() => document.querySelector('[data-shop-search]')?.focus(), 100); }); window.addEventListener('hashchange', () => { currentRoute = (location.hash || '#/').replace('#/', '') || 'home'; render(); });
      updateCartCount(); render();
    </script>
  </body>
</html>
