services:
  storefront:
    build:
      context: .
      args:
        NEXT_PUBLIC_STORE_URL: ${NEXT_PUBLIC_STORE_URL}
        NEXT_PUBLIC_ADMIN_LOGIN_URL: ${NEXT_PUBLIC_ADMIN_LOGIN_URL}
        ADMIN_LOGIN_URL: ${ADMIN_LOGIN_URL}
    env_file:
      - .env.deploy
    environment:
      ADMIN_LOGIN_PASSWORD: ${ADMIN_LOGIN_PASSWORD}
      ADMIN_LOGIN_NAME: ${ADMIN_LOGIN_NAME:-Admin Forkom}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - app

  admin:
    build:
      context: .
      args:
        NEXT_PUBLIC_STORE_URL: ${NEXT_PUBLIC_STORE_URL}
        NEXT_PUBLIC_ADMIN_LOGIN_URL: ${NEXT_PUBLIC_ADMIN_LOGIN_URL}
        ADMIN_LOGIN_URL: ${ADMIN_LOGIN_URL}
    env_file:
      - .env.deploy
    environment:
      ADMIN_LOGIN_PASSWORD: ${ADMIN_LOGIN_PASSWORD}
      ADMIN_LOGIN_NAME: ${ADMIN_LOGIN_NAME:-Admin Forkom}
    command: ["npx", "next", "start", "admin", "-p", "3001"]
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - storefront
      - admin
    networks:
      - app

networks:
  app:

volumes:
  caddy_data:
  caddy_config:
